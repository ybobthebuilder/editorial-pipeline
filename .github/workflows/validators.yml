name: validators

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the fonts whose widths geometry.js embeds
        run: sudo apt-get install -y --no-install-recommends fonts-liberation
      - name: Run validator tests and refuse an empty or failing run
        # node exits 0 when a glob matches nothing, and the pipe to tee hides a failing exit code,
        # hence the two greps (the same guard as migrations.yml).
        run: |
          node --test 'validators/*.test.js' | tee test-output.txt
          grep -qE '^# tests [1-9][0-9]*$' test-output.txt
          grep -qE '^# fail 0$' test-output.txt
      - name: Run render tests and refuse an empty or failing run
        run: |
          node --test 'render/*.test.js' | tee render-output.txt
          grep -qE '^# tests [1-9][0-9]*$' render-output.txt
          grep -qE '^# fail 0$' render-output.txt
      - name: Run skills tests and refuse an empty or failing run
        run: |
          node --test 'tests/skills/*.test.js' | tee skills-output.txt
          grep -qE '^# tests [1-9][0-9]*$' skills-output.txt
          grep -qE '^# fail 0$' skills-output.txt
      - name: Run docs tests (CLAUDE.md map against git ls-files) and refuse an empty or failing run
        run: |
          node --test 'tests/docs/*.test.js' | tee docs-output.txt
          grep -qE '^# tests [1-9][0-9]*$' docs-output.txt
          grep -qE '^# fail 0$' docs-output.txt
      - name: Check config/baseline and skills against their .checksums
        run: node scripts/verify-baseline.js --dir config/baseline --skills skills --offline true
